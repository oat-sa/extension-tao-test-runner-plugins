<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Test Runner Plugins - Lock Down Browser</title>
        <base href="../../../../../../../../../tao/views/" />
        <link rel="stylesheet" type="text/css" href="js/lib/qunit/qunit.css" />
        <script type="text/javascript" src="js/lib/qunit/qunit.js"></script>
        <script type="text/javascript" src="js/lib/require.js"></script>

        <script type="text/javascript">
            QUnit.config.autostart = false;

            require(['/tao/ClientConfig/config'], function () {
                require.config({
                    config: {
                        context: {
                            lockDownBrowser: {}
                        }
                    }
                });

                require(['taoTestRunnerPlugins/test/runner/plugins/security/lockDownBrowser/mocks'], function () {
                    require(['taoTestRunnerPlugins/test/runner/plugins/security/lockDownBrowser/test'], function () {
                        QUnit.start();
                    });
                });
            });
        </script>
    </head>
    <body>
        <div id="qunit"></div>
        <div id="qunit-fixture">
            <div id="item-content">Assessment item</div>
        </div>
    </body>
</html>
